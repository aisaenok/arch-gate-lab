repositories:
  frontend:
    type: typescript
    root: ./apps/frontend
    roles: [api-consumer]
    sourceDir: scenarios/invalid-http/src
    generatedRuntimeDirs:
      - src/shared/api/generated
    allowDirectHttpDirs: []
    allowManualContractTypeDirs: []
    httpModules:
      - axios

rules:
  - id: API001
    description: API consumer code may reach HTTP only through generated runtime
    scope: check
    select:
      fact: http-reach
      repositoryRoles:
        - field: repositoryId
          role: api-consumer
      where:
        - field: sourceDirectHttpAllowed
          equals: false
    assert:
      - field: throughGeneratedRuntime
        equals: true
        message: HTTP is reachable without passing through generated runtime
    sourceField: sourceFile
    targetField: terminalFile
