repositories:
  frontend:
    type: typescript
    root: ./apps/frontend
    roles: [api-consumer]
    sourceDir: scenarios/invalid-dto/src
    generatedRuntimeDirs:
      - src/shared/api/generated
    allowDirectHttpDirs: []
    allowManualContractTypeDirs: []
    httpModules:
      - axios

rules:
  - id: API002
    description: Request types crossing generated API boundary need contract provenance
    scope: check
    select:
      fact: api-boundary-type
      repositoryRoles:
        - field: repositoryId
          role: api-consumer
    assert:
      - field: contractTypeProvenance
        equals: true
        message: A request passed to generated API is typed from a local non-contract declaration
    sourceField: source
    targetField: actualType
