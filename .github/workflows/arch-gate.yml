name: architecture-gate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout lab
        uses: actions/checkout@v4

      - name: Checkout arch-gate
        uses: actions/checkout@v4
        with:
          repository: aisaenok/arch-gate
          ref: main
          path: .tools/arch-gate

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build arch-gate
        working-directory: .tools/arch-gate
        run: |
          npm install
          npm test

      - name: Check valid monorepo
        run: node .tools/arch-gate/dist/src/index.js check --config ./arch-gate.yml

      - name: Reject direct HTTP usage
        shell: bash
        run: |
          set +e
          node .tools/arch-gate/dist/src/index.js check --config ./arch-gate.invalid-http.yml
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "Expected API001 FAIL exit 1, got $status"
            exit 1
          fi

      - name: Reject manual boundary DTO
        shell: bash
        run: |
          set +e
          node .tools/arch-gate/dist/src/index.js check --config ./arch-gate.invalid-dto.yml
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "Expected API002 FAIL exit 1, got $status"
            exit 1
          fi

      - name: Check valid architecture plan
        run: node .tools/arch-gate/dist/src/index.js plan ./plans/valid.json --config ./arch-gate.yml

      - name: Reject custom HTTP plan
        shell: bash
        run: |
          set +e
          node .tools/arch-gate/dist/src/index.js plan ./plans/invalid-custom-http.json --config ./arch-gate.yml
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "Expected PLAN002 FAIL exit 1, got $status"
            exit 1
          fi

      - name: Reject wrong wire source
        shell: bash
        run: |
          set +e
          node .tools/arch-gate/dist/src/index.js plan ./plans/invalid-wire-source.json --config ./arch-gate.yml
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "Expected PLAN003/PLAN004 FAIL exit 1, got $status"
            exit 1
          fi

      - name: Reject missing operation
        shell: bash
        run: |
          set +e
          node .tools/arch-gate/dist/src/index.js plan ./plans/invalid-operation.json --config ./arch-gate.yml
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "Expected PLAN001 FAIL exit 1, got $status"
            exit 1
          fi
