name: architecture-gate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout lab
        uses: actions/checkout@v4

      - name: Checkout arch-gate
        uses: actions/checkout@v4
        with:
          repository: aisaenok/arch-gate
          ref: feat/scip-cross-repo-type-provenance
          path: .tools/arch-gate

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Coursier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/coursier-bin"
          curl -fsLo "$RUNNER_TEMP/coursier-bin/coursier" https://git.io/coursier-cli
          chmod +x "$RUNNER_TEMP/coursier-bin/coursier"
          echo "$RUNNER_TEMP/coursier-bin" >> "$GITHUB_PATH"

      - name: Build backend SCIP index
        working-directory: services/backend
        shell: bash
        run: |
          set -euo pipefail
          coursier launch org.scip-code:scip-java:0.14.2 \
            -M org.scip_code.scip_java.ScipJava \
            -- index
          test -s index.scip

      - name: Build frontend SCIP index
        working-directory: apps/frontend
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save typescript@5.9.3 axios@1.7.9
          npm install --global @sourcegraph/scip-typescript@0.4.0
          scip-typescript index
          test -s index.scip

      - name: Build arch-gate
        working-directory: .tools/arch-gate
        run: |
          npm install
          npm test

      - name: Check valid monorepo
        run: node .tools/arch-gate/dist/src/index.js check --config ./arch-gate.yml

      - name: Reject direct HTTP usage
        shell: bash
        run: |
          set +e
          node .tools/arch-gate/dist/src/index.js check --config ./arch-gate.invalid-http.yml
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "Expected API001 FAIL exit 1, got $status"
            exit 1
          fi

      - name: Reject manual boundary DTO
        shell: bash
        run: |
          set +e
          node .tools/arch-gate/dist/src/index.js check --config ./arch-gate.invalid-dto.yml
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "Expected API002 FAIL exit 1, got $status"
            exit 1
          fi

      - name: Check valid architecture plan
        run: node .tools/arch-gate/dist/src/index.js plan ./plans/valid.json --config ./arch-gate.yml

      - name: Reject custom HTTP plan
        shell: bash
        run: |
          set +e
          node .tools/arch-gate/dist/src/index.js plan ./plans/invalid-custom-http.json --config ./arch-gate.yml
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "Expected PLAN002 FAIL exit 1, got $status"
            exit 1
          fi

      - name: Reject wrong wire source
        shell: bash
        run: |
          set +e
          node .tools/arch-gate/dist/src/index.js plan ./plans/invalid-wire-source.json --config ./arch-gate.yml
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "Expected PLAN003/PLAN004 FAIL exit 1, got $status"
            exit 1
          fi

      - name: Reject missing operation
        shell: bash
        run: |
          set +e
          node .tools/arch-gate/dist/src/index.js plan ./plans/invalid-operation.json --config ./arch-gate.yml
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "Expected PLAN001 FAIL exit 1, got $status"
            exit 1
          fi
