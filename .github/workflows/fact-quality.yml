name: fact-quality

on:
  push:
    branches:
      - test/fact-quality
  pull_request:
    paths:
      - "quality/**"
      - "apps/frontend/**"
      - "packages/api-contracts/**"
      - "services/backend/**"
      - "arch-gate*.yml"
      - ".github/workflows/fact-quality.yml"

jobs:
  semantic-facts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout lab
        uses: actions/checkout@v4

      - name: Checkout arch-gate semantic facts
        uses: actions/checkout@v4
        with:
          repository: aisaenok/arch-gate
          ref: refactor/remove-typescript-module-fallback
          path: .tools/arch-gate

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Coursier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/coursier-bin"
          curl -fsLo "$RUNNER_TEMP/coursier-bin/coursier" https://git.io/coursier-cli
          chmod +x "$RUNNER_TEMP/coursier-bin/coursier"
          echo "$RUNNER_TEMP/coursier-bin" >> "$GITHUB_PATH"

      - name: Build backend SCIP index
        working-directory: services/backend
        shell: bash
        run: |
          set -euo pipefail
          coursier launch org.scip-code:scip-java:0.14.2 \
            -M org.scip_code.scip_java.ScipJava \
            -- index
          test -s index.scip

      - name: Build frontend SCIP index
        working-directory: apps/frontend
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save typescript@5.9.3
          npm install --global @sourcegraph/scip-typescript@0.4.0
          scip-typescript index
          test -s index.scip

      - name: Build quality TypeScript SCIP indexes
        shell: bash
        run: |
          set -euo pipefail
          for project in \
            quality/scenarios/false-positive-unused-axios \
            quality/scenarios/false-positive-generated-alias \
            quality/scenarios/false-negative-renamed-dto \
            quality/scenarios/false-negative-wrapper-bypass \
            quality/scenarios/manual-boundary-dto \
            quality/scenarios/false-negative-generated-extra-endpoint
          do
            cat > "$project/tsconfig.json" <<'JSON'
          {
            "compilerOptions": {
              "target": "ES2022",
              "module": "NodeNext",
              "moduleResolution": "NodeNext",
              "strict": true,
              "skipLibCheck": true,
              "noEmit": true,
              "lib": ["ES2022", "DOM"]
            },
            "include": ["src/**/*.ts"]
          }
          JSON
            (
              cd "$project"
              scip-typescript index
              test -s index.scip
            )
          done

      - name: Build and test arch-gate
        working-directory: .tools/arch-gate
        run: |
          npm install
          npm test

      - name: Valid monorepo passes including JAX-RS contract coverage
        run: node .tools/arch-gate/dist/src/index.js check --config ./arch-gate.yml

      - name: Unused axios import is not an HTTP call
        run: node .tools/arch-gate/dist/src/index.js check --config ./quality/false-positive-unused-axios.yml

      - name: Alias to generated DTO preserves provenance
        run: node .tools/arch-gate/dist/src/index.js check --config ./quality/false-positive-generated-alias.yml

      - name: Standalone similar-shape DTO is not guessed to be wire DTO
        run: node .tools/arch-gate/dist/src/index.js check --config ./quality/false-negative-renamed-dto.yml

      - name: Wrapper bypass is rejected
        shell: bash
        run: |
          set +e
          node .tools/arch-gate/dist/src/index.js check --config ./quality/false-negative-wrapper-bypass.yml
          status=$?
          set -e
          test "$status" -eq 1

      - name: Manual boundary DTO is rejected
        shell: bash
        run: |
          set +e
          node .tools/arch-gate/dist/src/index.js check --config ./quality/manual-boundary-dto.yml
          status=$?
          set -e
          test "$status" -eq 1

      - name: Extra generated frontend endpoint is rejected
        shell: bash
        run: |
          set +e
          node .tools/arch-gate/dist/src/index.js check --config ./quality/false-negative-generated-extra-endpoint.yml
          status=$?
          set -e
          test "$status" -eq 1

      - name: Backend endpoint absent from OpenAPI is rejected
        shell: bash
        run: |
          set +e
          node .tools/arch-gate/dist/src/index.js check --config ./quality/false-negative-backend-endpoint.yml
          status=$?
          set -e
          test "$status" -eq 1

      - name: Contract operation missing in backend is rejected
        shell: bash
        run: |
          set +e
          node .tools/arch-gate/dist/src/index.js check --config ./quality/missing-backend-implementation.yml
          status=$?
          set -e
          test "$status" -eq 1

      - name: Contract operation missing in generated frontend is rejected
        shell: bash
        run: |
          set +e
          node .tools/arch-gate/dist/src/index.js check --config ./quality/missing-frontend-generated-operation.yml
          status=$?
          set -e
          test "$status" -eq 1

      - name: Java parse failure produces PARTIAL
        shell: bash
        run: |
          set +e
          node .tools/arch-gate/dist/src/index.js check --config ./quality/partial-java-parse.yml
          status=$?
          set -e
          test "$status" -eq 3

      - name: Unknown fact kind is a config error
        shell: bash
        run: |
          set +e
          node .tools/arch-gate/dist/src/index.js check --config ./quality/false-negative-policy-typo.yml
          status=$?
          set -e
          test "$status" -eq 2
