name: http-reachability

on:
  push:
    branches:
      - test/http-call-reachability
  pull_request:
    paths:
      - "quality/scenarios/false-positive-unused-wrapper/**"
      - "quality/false-positive-unused-wrapper.yml"
      - ".github/workflows/http-reachability.yml"

jobs:
  characterize:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Checkout arch-gate main
        uses: actions/checkout@v4
        with:
          repository: aisaenok/arch-gate
          ref: main
          path: .tools/arch-gate

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build arch-gate
        working-directory: .tools/arch-gate
        run: |
          npm install
          npm test

      - name: Unused wrapper import currently false-positives
        shell: bash
        run: |
          set +e
          node .tools/arch-gate/dist/src/index.js check --config ./quality/false-positive-unused-wrapper.yml
          status=$?
          set -e

          if [ "$status" -ne 1 ]; then
            echo "Expected current false-positive FAIL exit 1, got $status"
            exit 1
          fi
