name: jaxrs-unresolved-interface

on:
  push:
    branches:
      - test/jaxrs-unresolved-interface-evidence
  pull_request:
    paths:
      - "quality/jaxrs-unresolved/**"
      - ".github/workflows/jaxrs-unresolved-interface.yml"

jobs:
  source-scope:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Checkout arch-gate Java source evidence
        uses: actions/checkout@v4
        with:
          repository: aisaenok/arch-gate
          ref: feat/java-source-evidence
          path: .tools/arch-gate

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and test arch-gate
        working-directory: .tools/arch-gate
        run: |
          npm install
          npm test

      - name: Generated interface included in sourceDirs passes
        run: |
          node .tools/arch-gate/dist/src/index.js check --config ./quality/jaxrs-unresolved/generated-in-scope.yml

      - name: Generated interface excluded from configured scope fails
        shell: bash
        run: |
          set +e
          node .tools/arch-gate/dist/src/index.js check --config ./quality/jaxrs-unresolved/generated-out-of-scope.yml
          status=$?
          set -e
          test "$status" -eq 1

      - name: Missing configured generated source is PARTIAL
        shell: bash
        run: |
          set +e
          node .tools/arch-gate/dist/src/index.js check --config ./quality/jaxrs-unresolved/generated-source-missing.yml
          status=$?
          set -e

          test "$status" -eq 3
