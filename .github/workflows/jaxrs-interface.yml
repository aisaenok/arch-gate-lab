name: jaxrs-interface

on:
  push:
    branches:
      - test/jaxrs-interface-inheritance
  pull_request:
    paths:
      - "quality/jaxrs-interface/**"
      - ".github/workflows/jaxrs-interface.yml"

jobs:
  characterize:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Checkout arch-gate main
        uses: actions/checkout@v4
        with:
          repository: aisaenok/arch-gate
          ref: main
          path: .tools/arch-gate

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build arch-gate
        working-directory: .tools/arch-gate
        run: |
          npm install
          npm test

      - name: Interface-only declaration currently false-passes
        run: |
          node .tools/arch-gate/dist/src/index.js check --config ./quality/jaxrs-interface/interface-only.yml
          echo "Known false green reproduced: annotated interface counted as backend implementation."

      - name: Annotated interface plus implementation also passes
        run: |
          node .tools/arch-gate/dist/src/index.js check --config ./quality/jaxrs-interface/inherited.yml
