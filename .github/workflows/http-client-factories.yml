name: http-client-factories

on:
  push:
    branches:
      - test/http-client-factories
  pull_request:
    paths:
      - "quality/scenarios/axios-create-instance/**"
      - "quality/scenarios/axios-create-method-alias/**"
      - "quality/scenarios/axios-create-only/**"
      - "quality/axios-create-instance.yml"
      - "quality/axios-create-method-alias.yml"
      - "quality/axios-create-only.yml"
      - ".github/workflows/http-client-factories.yml"

jobs:
  factory-provenance:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Checkout arch-gate HTTP client factories
        uses: actions/checkout@v4
        with:
          repository: aisaenok/arch-gate
          ref: feat/http-client-factories
          path: .tools/arch-gate

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and test arch-gate
        working-directory: .tools/arch-gate
        run: |
          npm install
          npm test

      - name: Axios create alone is not treated as HTTP
        run: |
          node .tools/arch-gate/dist/src/index.js check --config ./quality/axios-create-only.yml

      - name: Axios create instance extra endpoint is rejected
        shell: bash
        run: |
          set +e
          node .tools/arch-gate/dist/src/index.js check --config ./quality/axios-create-instance.yml
          status=$?
          set -e
          test "$status" -eq 1

      - name: Axios create method alias extra endpoint is rejected
        shell: bash
        run: |
          set +e
          node .tools/arch-gate/dist/src/index.js check --config ./quality/axios-create-method-alias.yml
          status=$?
          set -e
          test "$status" -eq 1
