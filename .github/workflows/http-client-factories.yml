name: http-client-factories

on:
  push:
    branches:
      - test/http-client-factories
  pull_request:
    paths:
      - "quality/scenarios/axios-create-instance/**"
      - "quality/scenarios/axios-create-method-alias/**"
      - "quality/axios-create-instance.yml"
      - "quality/axios-create-method-alias.yml"
      - ".github/workflows/http-client-factories.yml"

jobs:
  characterize:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Checkout arch-gate main
        uses: actions/checkout@v4
        with:
          repository: aisaenok/arch-gate
          ref: main
          path: .tools/arch-gate

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build arch-gate
        working-directory: .tools/arch-gate
        run: |
          npm install
          npm test

      - name: Axios create instance currently false-passes
        run: |
          node .tools/arch-gate/dist/src/index.js check --config ./quality/axios-create-instance.yml
          echo "Known false green reproduced: axios.create() instance loses transport provenance."

      - name: Axios create method alias currently false-passes
        run: |
          node .tools/arch-gate/dist/src/index.js check --config ./quality/axios-create-method-alias.yml
          echo "Known false green reproduced: method alias from axios.create() instance is invisible."
