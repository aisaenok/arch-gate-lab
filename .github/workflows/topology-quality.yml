name: topology-quality

on:
  push:
    branches:
      - test/topology-relations
  pull_request:
    paths:
      - "quality/topology/**"
      - ".github/workflows/topology-quality.yml"

jobs:
  characterize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout lab
        uses: actions/checkout@v4

      - name: Checkout arch-gate main
        uses: actions/checkout@v4
        with:
          repository: aisaenok/arch-gate
          ref: main
          path: .tools/arch-gate

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build arch-gate
        working-directory: .tools/arch-gate
        run: |
          npm install
          npm test

      - name: Current role-only topology incorrectly passes
        run: |
          node .tools/arch-gate/dist/src/index.js check --config ./quality/topology/current-role-only.yml
          echo "Known false negative reproduced: swapped providers were accepted."
