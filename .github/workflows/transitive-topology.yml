name: transitive-topology

on:
  push:
    branches:
      - test/transitive-topology
  pull_request:
    paths:
      - "quality/transitive/**"
      - ".github/workflows/transitive-topology.yml"

jobs:
  characterize:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Checkout arch-gate main
        uses: actions/checkout@v4
        with:
          repository: aisaenok/arch-gate
          ref: main
          path: .tools/arch-gate

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build arch-gate
        working-directory: .tools/arch-gate
        run: |
          npm install
          npm test

      - name: Valid transitive provider chain is currently only PARTIAL
        shell: bash
        run: |
          set +e
          node .tools/arch-gate/dist/src/index.js plan ./quality/transitive/intent.json --config ./quality/transitive/valid-chain.yml
          status=$?
          set -e
          test "$status" -eq 3

      - name: Wrong transitive provider chain is also only PARTIAL
        shell: bash
        run: |
          set +e
          node .tools/arch-gate/dist/src/index.js plan ./quality/transitive/intent.json --config ./quality/transitive/wrong-chain.yml
          status=$?
          set -e
          test "$status" -eq 3
