repositories:
  contracts:
    type: openapi
    root: ./contracts
    roles: [api-contract]
    openapi: openapi.yaml

  primary:
    type: java
    root: ./backends/primary
    roles: [api-provider]
    sourceDirs: [src/main/java]
    frameworks: [jax-rs]

  replica:
    type: java
    root: ./backends/replica
    roles: [api-provider]
    sourceDirs: [src/main/java]
    frameworks: [jax-rs]

relations:
  - type: implemented-by
    from: contracts
    to: primary
  - type: implemented-by
    from: contracts
    to: replica

rules:
  - id: Q001
    description: Every related provider must implement the contract operation
    scope: check
    select:
      fact: contract-operation
    assert:
      - field: operationKey
        memberOf:
          fact: backend-endpoint
          field: operationKey
          repositoryRelation:
            type: implemented-by
            currentField: repositoryId
            candidateField: repositoryId
            direction: outgoing
    sourceField: operationId
    targetField: operationKey
