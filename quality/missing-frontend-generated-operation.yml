repositories:
  frontend:
    type: typescript
    root: ../apps/frontend
    roles: [api-consumer]
    sourceDir: src
    generatedRuntimeDirs:
      - src/shared/api/generated
    allowDirectHttpDirs: []
    allowManualContractTypeDirs: []
    httpModules: [axios]

  contracts:
    type: openapi
    root: ./contracts/missing-implementation
    roles: [api-contract]
    openapi: openapi.yaml

rules:
  - id: API007
    description: Every API contract operation must exist in generated frontend runtime
    scope: check
    select:
      fact: contract-operation
      repositoryRoles:
        - field: repositoryId
          role: api-contract
    assert:
      - field: operationKey
        memberOf:
          fact: http-call
          field: operationKey
          repositoryRoles:
            - field: repositoryId
              role: api-consumer
          where:
            - field: sourceGenerated
              equals: true
            - field: operationKeyKnown
              equals: true
        message: API contract operation has no generated frontend runtime call
    sourceField: operationId
    targetField: operationKey
