repositories:
  frontend:
    type: typescript
    root: ./scenarios/false-positive-generated-alias
    roles: [api-consumer]
    sourceDir: src
    generatedRuntimeDirs:
      - ../../../apps/frontend/src/shared/api/generated
    allowDirectHttpDirs: []
    allowManualContractTypeDirs: []
    httpModules: [axios]
    scipIndex: index.scip

  generated-client-primary:
    type: typescript
    root: ../apps/frontend
    roles: [generated-client]
    sourceDir: src/shared/api/generated
    generatedRuntimeDirs:
      - src/shared/api/generated
    allowDirectHttpDirs: []
    allowManualContractTypeDirs: []
    httpModules: [axios]
    scipIndex: index.scip

  generated-client-duplicate:
    type: typescript
    root: ../apps/frontend
    roles: [generated-client]
    sourceDir: src/shared/api/generated
    generatedRuntimeDirs:
      - src/shared/api/generated
    allowDirectHttpDirs: []
    allowManualContractTypeDirs: []
    httpModules: [axios]
    scipIndex: index.scip

rules:
  - id: API002
    description: Generated API boundary requires unambiguous generated type provenance
    scope: check
    select:
      fact: api-boundary-type
      repositoryRoles:
        - field: repositoryId
          role: api-consumer
    assert:
      - field: contractTypeProvenance
        equals: true
