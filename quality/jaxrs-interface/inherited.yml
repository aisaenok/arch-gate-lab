repositories:
  contracts:
    type: openapi
    root: ./jaxrs-interface/contracts
    roles: [api-contract]
    openapi: openapi.yaml

  backend:
    type: java
    root: ./jaxrs-interface/inherited
    roles: [api-provider]
    sourceDirs:
      - src/main/java
    frameworks:
      - jax-rs

rules:
  - id: API006
    description: Every contract operation must have a concrete backend implementation
    scope: check
    select:
      fact: contract-operation
      repositoryRoles:
        - field: repositoryId
          role: api-contract
    assert:
      - field: operationKey
        memberOf:
          fact: backend-endpoint
          field: operationKey
          repositoryRoles:
            - field: repositoryId
              role: api-provider
        message: Contract operation has no concrete backend implementation
    sourceField: operationId
    targetField: operationKey
