repositories:
  contracts:
    type: openapi
    root: ./contracts
    roles: [api-contract]
    openapi: openapi.yaml

  backend:
    type: java
    root: ./backend
    roles: [api-provider]
    sourceDirs:
      - src/main/java
    frameworks:
      - jax-rs
    scipIndex: index.scip

rules:
  - id: API006
    description: Missing external interface owner must not become confident absence
    scope: check
    select:
      fact: contract-operation
      repositoryRoles:
        - field: repositoryId
          role: api-contract
    assert:
      - field: operationKey
        memberOf:
          fact: backend-endpoint
          field: operationKey
          repositoryRoles:
            - field: repositoryId
              role: api-provider
    sourceField: operationId
    targetField: operationKey
