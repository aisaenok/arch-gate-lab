repositories:
  contracts:
    type: openapi
    root: ../packages/api-contracts
    roles: [api-contract]
    openapi: openapi.yaml

  backend:
    type: java
    root: ./scenarios/partial-java-parse/backend
    roles: [api-provider]
    sourceDirs:
      - src/main/java
    frameworks:
      - jax-rs

rules:
  - id: API005
    description: Backend endpoint must exist in the API contract
    scope: check
    select:
      fact: backend-endpoint
      repositoryRoles:
        - field: repositoryId
          role: api-provider
    assert:
      - field: operationKey
        memberOf:
          fact: contract-operation
          field: operationKey
          repositoryRoles:
            - field: repositoryId
              role: api-contract
