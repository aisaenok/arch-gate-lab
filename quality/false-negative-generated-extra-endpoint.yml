repositories:
  frontend:
    type: typescript
    root: ./scenarios/false-negative-generated-extra-endpoint
    roles: [api-consumer]
    sourceDir: src
    generatedRuntimeDirs:
      - src/shared/api/generated
    allowDirectHttpDirs: []
    allowManualContractTypeDirs: []
    httpModules: [axios]

  contracts:
    type: openapi
    root: ../packages/api-contracts
    roles: [api-contract]
    openapi: openapi.yaml

rules:
  - id: API001
    description: API consumer must use generated runtime for HTTP transport
    scope: check
    select:
      fact: http-usage
      repositoryRoles:
        - field: repositoryId
          role: api-consumer
    assert:
      - field: directHttpAllowed
        equals: true
        message: Direct HTTP transport is forbidden outside generated runtime
    sourceField: source
    targetField: target
