repositories:
  frontend:
    type: typescript
    root: ./scenarios/false-negative-renamed-dto
    roles: [api-consumer]
    sourceDir: src
    generatedRuntimeDirs: []
    allowDirectHttpDirs: []
    allowManualContractTypeDirs: []
    httpModules: [axios]

  contracts:
    type: openapi
    root: ../packages/api-contracts
    roles: [api-contract]
    openapi: openapi.yaml

rules:
  - id: API002
    description: Wire DTO must come from the API contract
    scope: check
    select:
      fact: declared-type
      repositoryRoles:
        - field: repositoryId
          role: api-consumer
      where:
        - field: manualContractTypeAllowed
          equals: false
    assert:
      - field: name
        not: true
        memberOf:
          fact: contract-schema
          field: name
          repositoryRoles:
            - field: repositoryId
              role: api-contract
        message: Consumer manually declares a type owned by the API contract
    sourceField: source
    targetField: name
