repositories:
  frontend:
    type: typescript
    root: ./scenarios/generated-fetch-alias
    roles: [api-consumer]
    sourceDir: src
    generatedRuntimeDirs:
      - src/shared/api/generated
    allowDirectHttpDirs: []
    allowManualContractTypeDirs: []
    httpModules:
      - axios

  contracts:
    type: openapi
    root: ../packages/api-contracts
    roles: [api-contract]
    openapi: openapi.yaml

rules:
  - id: API003
    description: Generated runtime HTTP operations must exist in the API contract
    scope: check
    select:
      fact: http-call
      repositoryRoles:
        - field: repositoryId
          role: api-consumer
      where:
        - field: sourceGenerated
          equals: true
        - field: operationKeyKnown
          equals: true
    assert:
      - field: operationKey
        memberOf:
          fact: contract-operation
          field: operationKey
          repositoryRoles:
            - field: repositoryId
              role: api-contract
        message: Generated runtime calls an HTTP operation absent from the API contract
    sourceField: source
    targetField: operationKey

  - id: API004
    description: Generated runtime HTTP routes must be statically identifiable
    scope: check
    select:
      fact: http-call
      repositoryRoles:
        - field: repositoryId
          role: api-consumer
      where:
        - field: sourceGenerated
          equals: true
    assert:
      - field: operationKeyKnown
        equals: true
        message: Generated runtime HTTP call has an unresolved method/path
    sourceField: source
    targetField: transport
