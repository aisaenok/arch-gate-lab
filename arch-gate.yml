repositories:
  frontend:
    type: typescript
    root: ./apps/frontend
    roles: [api-consumer]
    sourceDir: src
    generatedRuntimeDirs:
      - src/shared/api/generated
    allowDirectHttpDirs: []
    allowManualContractTypeDirs: []
    httpModules:
      - axios

  contracts:
    type: openapi
    root: ./packages/api-contracts
    roles: [api-contract]
    openapi: openapi.yaml

  backend:
    type: java
    root: ./services/backend
    roles: [api-provider]

rules:
  - id: API001
    description: API consumer must use generated runtime for HTTP transport
    scope: check
    select:
      fact: http-usage
      repositoryRoles:
        - field: repositoryId
          role: api-consumer
    assert:
      - field: directHttpAllowed
        equals: true
        message: Direct HTTP transport is forbidden outside generated runtime
    sourceField: source
    targetField: target

  - id: API002
    description: Wire DTO must come from the API contract
    scope: check
    select:
      fact: declared-type
      repositoryRoles:
        - field: repositoryId
          role: api-consumer
      where:
        - field: manualContractTypeAllowed
          equals: false
    assert:
      - field: name
        not: true
        memberOf:
          fact: contract-schema
          field: name
          repositoryRoles:
            - field: repositoryId
              role: api-contract
        message: Consumer manually declares a type owned by the API contract
    sourceField: source
    targetField: name

  - id: PLAN001
    description: Planned operation must exist in the API contract
    scope: plan
    select:
      fact: intent-api-call
      repositoryRoles:
        - field: consumerRepositoryId
          role: api-consumer
        - field: providerRepositoryId
          role: api-provider
    assert:
      - field: operationId
        memberOf:
          fact: contract-operation
          field: operationId
          repositoryRoles:
            - field: repositoryId
              role: api-contract
    targetField: operationId

  - id: PLAN002
    description: Planned API call must use generated runtime
    scope: plan
    select:
      fact: intent-api-call
      repositoryRoles:
        - field: consumerRepositoryId
          role: api-consumer
        - field: providerRepositoryId
          role: api-provider
    assert:
      - field: via
        equals: generated-runtime
    targetField: operationId

  - id: PLAN003
    description: Planned wire type must exist in its declared source repository
    scope: plan
    select:
      fact: intent-wire-type
      repositoryRoles:
        - field: consumerRepositoryId
          role: api-consumer
    assert:
      - field: name
        memberOf:
          fact: contract-schema
          field: name
          repositoryMatch:
            sourceField: repositoryId
            currentField: sourceRepositoryId
    targetField: name

  - id: PLAN004
    description: Planned wire DTO source must be an API contract repository
    scope: plan
    select:
      fact: intent-wire-type
      repositoryRoles:
        - field: consumerRepositoryId
          role: api-consumer
    assert:
      - field: sourceRepositoryId
        hasRole: api-contract
    targetField: name
