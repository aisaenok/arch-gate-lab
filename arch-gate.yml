repositories:
  frontend:
    type: typescript
    root: ./apps/frontend
    roles: [api-consumer]
    sourceDir: src
    generatedRuntimeDirs:
      - src/shared/api/generated
    allowDirectHttpDirs: []
    allowManualContractTypeDirs: []
    httpModules:
      - axios

  contracts:
    type: openapi
    root: ./packages/api-contracts
    roles: [api-contract]
    openapi: openapi.yaml

  backend:
    type: java
    root: ./services/backend
    roles: [api-provider]

rules:
  - id: API001
    description: API consumer code may reach HTTP only through generated runtime
    scope: check
    select:
      fact: http-reach
      repositoryRoles:
        - field: repositoryId
          role: api-consumer
      where:
        - field: sourceDirectHttpAllowed
          equals: false
    assert:
      - field: throughGeneratedRuntime
        equals: true
        message: HTTP is reachable without passing through generated runtime
    sourceField: sourceFile
    targetField: terminalFile

  - id: API002
    description: Request types crossing generated API boundary need contract provenance
    scope: check
    select:
      fact: api-boundary-type
      repositoryRoles:
        - field: repositoryId
          role: api-consumer
    assert:
      - field: contractTypeProvenance
        equals: true
        message: A request passed to generated API is typed from a local non-contract declaration
    sourceField: source
    targetField: actualType

  - id: API003
    description: Generated runtime HTTP operations must exist in the API contract
    scope: check
    select:
      fact: http-call
      repositoryRoles:
        - field: repositoryId
          role: api-consumer
      where:
        - field: sourceGenerated
          equals: true
        - field: operationKeyKnown
          equals: true
    assert:
      - field: operationKey
        memberOf:
          fact: contract-operation
          field: operationKey
          repositoryRoles:
            - field: repositoryId
              role: api-contract
        message: Generated runtime calls an HTTP operation absent from the API contract
    sourceField: source
    targetField: operationKey

  - id: API004
    description: Generated runtime HTTP routes must be statically identifiable
    scope: check
    select:
      fact: http-call
      repositoryRoles:
        - field: repositoryId
          role: api-consumer
      where:
        - field: sourceGenerated
          equals: true
    assert:
      - field: operationKeyKnown
        equals: true
        message: Generated runtime HTTP call has an unresolved method/path
    sourceField: source
    targetField: transport

  - id: PLAN001
    description: Planned operation must exist in the API contract
    scope: plan
    select:
      fact: intent-api-call
      repositoryRoles:
        - field: consumerRepositoryId
          role: api-consumer
        - field: providerRepositoryId
          role: api-provider
    assert:
      - field: operationId
        memberOf:
          fact: contract-operation
          field: operationId
          repositoryRoles:
            - field: repositoryId
              role: api-contract
    targetField: operationId

  - id: PLAN002
    description: Planned API call must use generated runtime
    scope: plan
    select:
      fact: intent-api-call
      repositoryRoles:
        - field: consumerRepositoryId
          role: api-consumer
        - field: providerRepositoryId
          role: api-provider
    assert:
      - field: via
        equals: generated-runtime
    targetField: operationId

  - id: PLAN003
    description: Planned wire type must exist in its declared source repository
    scope: plan
    select:
      fact: intent-wire-type
      repositoryRoles:
        - field: consumerRepositoryId
          role: api-consumer
    assert:
      - field: name
        memberOf:
          fact: contract-schema
          field: name
          repositoryMatch:
            sourceField: repositoryId
            currentField: sourceRepositoryId
    targetField: name

  - id: PLAN004
    description: Planned wire DTO source must be an API contract repository
    scope: plan
    select:
      fact: intent-wire-type
      repositoryRoles:
        - field: consumerRepositoryId
          role: api-consumer
    assert:
      - field: sourceRepositoryId
        hasRole: api-contract
    targetField: name
